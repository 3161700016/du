<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>渡 · Du</title>
<style>
  :root {
    --bg: #fafaf8;
    --msg-user: #e8e6e0;
    --msg-ai: transparent;
    --text: #2c2c2c;
    --muted: #999;
    --border: #e0ded8;
    --accent: #8b7e6a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 顶部栏 ── */
  .header {
    padding: 12px 16px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
    letter-spacing: 0.5px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .header .name { color: var(--text); font-weight: 600; }

  /* ── 消息区 ── */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
    position: relative;
  }

  /* 背景水印 */
  .messages::before {
    content: "暮色苍茫看劲松 \A 乱云飞渡仍从容";
    white-space: pre;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 13px;
    color: var(--muted);
    opacity: 0.08;
    text-align: center;
    line-height: 2;
    pointer-events: none;
    z-index: 0;
    letter-spacing: 2px;
  }

  .msg { position: relative; z-index: 1; }

  .msg {
    max-width: 88%;
    line-height: 1.75;
    font-size: 15px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--msg-user);
    border-radius: 18px 18px 4px 18px;
    padding: 10px 15px;
  }

  .msg.ai {
    align-self: flex-start;
    padding: 10px 15px;
    border-radius: 18px 18px 18px 4px;
  }

  .msg .time {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    display: block;
  }

  /* ── 打字指示器 ── */
  .typing {
    align-self: flex-start;
    padding: 10px 15px;
    color: var(--muted);
    font-size: 14px;
    display: none;
  }
  .typing.active { display: block; }
  .typing span { animation: blink 1.4s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,60%,100% { opacity: 0.2; } 30% { opacity: 1; } }

  /* ── 底部输入栏 ── */
  .input-area {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
  }

  .input-area input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 10px 18px;
    font-size: 15px;
    outline: none;
    background: #fff;
    color: var(--text);
    font-family: inherit;
  }
  .input-area input:focus { border-color: var(--accent); }

  .input-area button {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s;
  }
  .input-area button:active { opacity: 0.7; }
  .input-area button:disabled { opacity: 0.4; }

  /* ── 空状态 ── */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 20px;
    line-height: 1.8;
  }

  /* ── 暗色模式 ── */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18;
      --msg-user: #2a2a26;
      --text: #d4d4d0;
      --muted: #888;
      --border: #333;
      --accent: #a89880;
    }
    .input-area input { background: #222; }
  }
</style>
</head>
<body>

<div class="header">
  渡 · <span class="name">Du</span>
</div>

<div class="messages" id="messages">
  <div class="empty-state" id="empty">
    <div>暮色苍茫看劲松，乱云飞渡仍从容。</div>
    <div style="margin-top:12px;">这里是渡。一艘停泊在校园网络里的船。</div>
    <div>你可以坐下来，说说话，也可以只是看看。</div>
    <div style="margin-top:16px;font-size:12px;opacity:0.6;">第一句话留下【你的名字】，渡会记住你。</div>
  </div>
  <div class="typing" id="typing">渡 <span>...</span></div>
</div>

<div class="input-area">
  <input
    type="text"
    id="input"
    placeholder="说点什么..."
    autocomplete="off"
    autocapitalize="none"
    enterkeyhint="send"
  >
  <button id="sendBtn" onclick="send()">↑</button>
</div>

<script>
// ── 状态 ──
const sessionId = 'phone-' + Date.now();
let isLoading = false;

// ── DOM ──
const messagesEl = document.getElementById('messages');
const emptyEl = document.getElementById('empty');
const typingEl = document.getElementById('typing');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

// ── 事件 ──
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

// ── 发送 ──
async function send() {
  const text = inputEl.value.trim();
  if (!text || isLoading) return;

  // 清空输入
  inputEl.value = '';
  isLoading = true;
  sendBtn.disabled = true;

  // 隐藏空状态
  if (emptyEl) emptyEl.style.display = 'none';

  // 渲染用户消息
  appendMessage('user', text);

  // 显示打字指示
  typingEl.classList.add('active');
  scrollBottom();

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text,
        session_id: sessionId,
      }),
    });

    const data = await resp.json();

    if (data.error) {
      appendMessage('ai', '⚠ ' + data.error);
    } else {
      appendMessage('ai', data.response);
    }
  } catch (err) {
    appendMessage('ai', '⚠ 无法连接到渡。电脑开着吗？服务器在运行吗？');
  }

  typingEl.classList.remove('active');
  isLoading = false;
  sendBtn.disabled = false;
  inputEl.focus();
}

// ── 渲染消息 ──
function appendMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;

  const now = new Date();
  const time = now.getHours().toString().padStart(2,'0') + ':' +
               now.getMinutes().toString().padStart(2,'0');

  div.innerHTML = text + '<span class="time">' + time + '</span>';
  messagesEl.insertBefore(div, typingEl);
  scrollBottom();
}

// ── 滚动到底 ──
function scrollBottom() {
  setTimeout(() => {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }, 50);
}

// ── 自动聚焦 ──
inputEl.focus();
</script>
</body>
</html>
